# main 브랜치에 코드가 합쳐질 때마다 사이트를 빌드해서 GitHub Pages에 배포합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 버튼으로 직접 실행할 수도 있습니다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 이전 실행을 취소하고 최신 코드만 배포합니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
